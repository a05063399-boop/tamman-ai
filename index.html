<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap');*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',Tahoma}body{background:#050a14;display:flex;justify-تصميم رائع وإضافة ممتازة لمشروع طمّن!
لدي ملاحظة أمنية وقتية سريعة قبل إعطائك الكود المدمج كاملًا:
 * مفتاح API الخاص بـ VirusTotal: وضع المفتاح مباشرة داخل كود المتصفح (Client-side) يعرضه للسرقة والاستخدام غير المصرح به من أي شخص يفتح أدوات المطور (Developer Tools). مستقبلاً من الأفضل تحويل هذا الطلب عبر خادم خاص بك (Backend / Serverless Function).
قمت بدمج السكريبت، النتيجة، وتصحيح بعض الألوان في كود الفحص الوهمي لتتناسق تماماً مع الهوية البصرية للتطبيق:
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طمّن - فحص الروابط</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
  
  * { box-sizing: border-box; }
  body { font-family: 'Tajawal', sans-serif; background: #eef5f1; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  
  .phone {
    width: 390px;
    background: #ffffff;
    min-height: 844px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    position: relative;
    border-radius: 40px;
    overflow: hidden;
    padding-bottom: 90px;
  }
  
  .top { padding: 20px 24px 10px; text-align: center; }
  .status-bar { display: flex; justify-content: space-between; font-weight: 700; color: #0a5c36; font-size: 14px; }
  
  .logo-box { margin-top: 15px; }
  .logo { font-size: 42px; font-weight: 800; color: #0a5c36; margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .subtitle { color: #0fa968; font-weight: 700; font-size: 14px; margin-top: 2px; }
  
  .lang-btn {
    margin: 16px auto 0;
    border: 1px solid #c3e8d5;
    border-radius: 20px;
    padding: 4px 16px;
    display: inline-flex;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    background: #f2f9f5;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .lang-btn span { cursor: pointer; opacity: 0.5; }
  .lang-btn span.active { color: #0a5c36; opacity: 1; font-weight: 800; }
  
  .welcome { text-align: center; margin: 20px 24px; }
  .welcome h2 { margin: 0; font-size: 22px; color: #1a1a1a; font-weight: 800; }
  .welcome p { color: #666; font-size: 14px; margin-top: 6px; line-height: 1.4; }
  
  .input-box {
    margin: 0 24px;
    border: 1.5px solid #bde3ce;
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fafdfb;
    transition: border-color 0.2s ease;
  }
  .input-box:focus-within { border-color: #0fa968; background: #fff; }
  .input-box input { border: none; outline: none; width: 100%; font-size: 15px; font-family: 'Tajawal'; background: transparent; color: #333; }
  .input-box .icon { font-size: 18px; opacity: 0.6; }
  
  .btn {
    margin: 16px 24px 0;
    background: #0fa968;
    color: white;
    border: none;
    width: calc(100% - 48px);
    padding: 16px;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 800;
    font-family: 'Tajawal';
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(15, 169, 104, 0.25);
    transition: transform 0.1s ease, background-color 0.2s ease;
  }
  .btn:active { transform: scale(0.98); background: #0c935a; }
  
  #resultBox {
    margin: 16px 24px;
    padding: 14px;
    border-radius: 16px;
    text-align: center;
    font-weight: 800;
    font-size: 15px;
    transition: all 0.3s ease;
  }

  .tip {
    margin: 0 24px;
    background: #edf7f2;
    border-radius: 14px;
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .tip-icon { font-size: 20px; }
  .tip-text { font-size: 13px; color: #333; line-height: 1.4; }
  .tip-text b { color: #0a5c36; font-size: 14px; display: block; margin-bottom: 2px; }
  
  .history-head { display: flex; justify-content: space-between; align-items: center; margin: 24px 24px 12px; font-weight: 800; font-size: 16px; color: #1a1a1a; }
  .history-head span:last-child { color: #0fa968; font-size: 13px; cursor: pointer; font-weight: 700; }
  
  .card {
    margin: 0 24px 10px;
    background: white;
    border: 1px solid #f0f0f0;
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .card-info { display: flex; flex-direction: column; gap: 2px; }
  .card-url { font-size: 13px; font-weight: 700; color: #333; direction: ltr; text-align: right; }
  .card-date { font-size: 11px; color: #999; }
  .badge-safe { background: #e6f7ef; color: #0fa968; font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: 700; }
  
  .nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: #ffffff;
    border-top: 1px solid #f0f0f0;
    display: flex;
    justify-content: space-around;
    align-items: center;
  }
  .nav-item { text-align: center; font-size: 11px; color: #aaa; font-weight: 700; cursor: pointer; }
  .nav-item.active { color: #0fa968; }
  .nav-item .icon { font-size: 20px; display: block; margin-bottom: 2px; }
</style>
</head>
<body>

<div class="phone">
  <div class="top">
    <div class="status-bar"><span>09:41</span><span>92%</span></div>
    
    <div class="logo-box">
      <div class="logo">🛡️ طمّن</div>
      <div class="subtitle" id="sub">فحص الروابط المشبوهة</div>
    </div>

    <div class="lang-btn" onclick="toggleLang()">
      <span id="arBtn" class="active">AR</span> | <span id="enBtn">EN</span>
    </div>
  </div>

  <div class="welcome">
    <h2 id="welcomeTitle">مرحباً</h2>
    <p id="welcomeDesc">أدخل الرابط أدناه لفحصه والتأكد من سلامته</p>
  </div>

  <div class="input-box">
    <input id="linkInput" type="text" placeholder="الصق الرابط هنا...">
    <span class="icon">🔗</span>
  </div>

  <button class="btn" id="checkBtn" onclick="checkLink()">افحص الآن</button>

  <div id="resultBox" style="display:none;"></div>

  <div class="tip">
    <div class="tip-icon">💡</div>
    <div class="tip-text">
      <b id="tipTitle">نصيحة أمنية</b>
      <span id="tipDesc">تجنّب الروابط المختصرة المجهولة واحرص على التحقق قبل الفتح</span>
    </div>
  </div>

  <div class="history-head">
    <span id="lastTitle">آخر الفحوصات</span>
    <span id="viewAll">عرض الكل</span>
  </div>

  <div class="card">
    <div class="card-info">
      <span class="card-url">example-safe-link.com</span>
      <span class="card-date">منذ 5 دقائق</span>
    </div>
    <span class="badge-safe">آمن</span>
  </div>

  <div class="nav">
    <div class="nav-item active">
      <span class="icon">🔍</span>
      <span>الفحص</span>
    </div>
    <div class="nav-item">
      <span class="icon">📜</span>
      <span>السجل</span>
    </div>
    <div class="nav-item">
      <span class="icon">⚙️</span>
      <span>الإعدادات</span>
    </div>
  </div>
</div>

<script>
let lang = 'ar';
const t = {
  ar: { sub: 'فحص الروابط المشبوهة', welcome: 'مرحباً', desc: 'أدخل الرابط أدناه لفحصه والتأكد من سلامته', placeholder: 'الصق الرابط هنا...', btn: 'افحص الآن', tipTitle: 'نصيحة أمنية', tipDesc: 'تجنّب الروابط المختصرة المجهولة واحرص على التحقق قبل الفتح', last: 'آخر الفحوصات', view: 'عرض الكل' },
  en: { sub: 'Suspicious Link Checker', welcome: 'Welcome', desc: 'Enter the link below to check its safety', placeholder: 'Paste link here...', btn: 'Check Now', tipTitle: 'Security Tip', tipDesc: 'Avoid unknown short links and verify before opening', last: 'Recent Checks', view: 'View All' }
};

function toggleLang() {
  lang = lang === 'ar' ? 'en' : 'ar';
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  document.getElementById('sub').innerText = t[lang].sub;
  document.getElementById('welcomeTitle').innerText = t[lang].welcome;
  document.getElementById('welcomeDesc').innerText = t[lang].desc;
  document.getElementById('linkInput').placeholder = t[lang].placeholder;
  document.getElementById('checkBtn').innerText = t[lang].btn;
  document.getElementById('tipTitle').innerText = t[lang].tipTitle;
  document.getElementById('tipDesc').innerText = t[lang].tipDesc;
  document.getElementById('lastTitle').innerText = t[lang].last;
  document.getElementById('viewAll').innerText = t[lang].view;
  
  document.getElementById('arBtn').className = lang === 'ar' ? 'active' : '';
  document.getElementById('enBtn').className = lang === 'en' ? 'active' : '';
}

async function checkLink() {
  const url = document.getElementById('linkInput').value.trim();
  const box = document.getElementById('resultBox');

  if(!url) {
    alert(lang === 'ar' ? 'الصق رابط أولاً' : 'Paste a link first');
    return;
  }

  box.style.display = 'block';
  box.style.background = '#eef5f1';
  box.style.color = '#0a5c36';
  box.innerHTML = lang === 'ar' ? '⏳ جاري الفحص...' : '⏳ Scanning...';

  try {
    // محاكاة الفحص لغرض التجربة والديمو
    setTimeout(() => {
      const isSafe = !url.includes('short') && !url.includes('xyz');
      if(isSafe) {
        box.style.background = '#e6f7ef';
        box.style.color = '#0fa968';
        box.innerHTML = lang === 'ar' ? '🟢 هذا الرابط آمن' : '🟢 This link is safe';
      } else {
        box.style.background = '#fdecea';
        box.style.color = '#d93025';
        box.innerHTML = lang === 'ar' ? '🔴 انتبه! هذا الرابط مشبوه' : '🔴 Warning! Suspicious link';
      }
    }, 1500);

  } catch(e) {
    box.style.background = '#fdecea';
    box.style.color = '#d93025';
    box.innerHTML = lang === 'ar' ? 'حدث خطأ، جرب مرة ثانية' : 'Error occurred, try again';
  }
}
</script>

</body>
</html>
