<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>طمّن AI</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Tajawal}body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%, #1a4731 0%, #0f1f1a 40%, #0a1210 100%);color:#fff}.nav{display:flex;justify-content:space-between;padding:22px 32px;max-width:1200px;margin:auto}.logo{font-size:28px;font-weight:800}.logo span{color:#22c55e}.badge{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);padding:6px 14px;border-radius:100px;font-size:13px;color:#86efac}.hero{max-width:1200px;margin:40px auto;padding:0 32px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px}@media(max-width:900px){.hero{grid-template-columns:1fr}}h1{font-size:54px;font-weight:800;line-height:1.1;margin-bottom:16px}h1 .g{color:#22c55e}.sub{color:#9ca3af;font-size:18px;line-height:1.7;margin-bottom:28px}.glass{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:28px}.in{display:flex;gap:12px}.in input{flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 18px;color:#fff;font-size:16px;outline:none}.btn{background:linear-gradient(180deg,#22c55e,#16a34a);color:#000;font-weight:800;border:none;border-radius:14px;padding:0 28px;cursor:pointer}.result{margin-top:18px;border-radius:16px;padding:18px;display:none;border:1px solid}.result.show{display:block}.safe{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#bbf7d0}.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#fecaca}.warn{background:rgba(234,179,8,.12);border-color:rgba(234,179,8,.3);color:#fde68a}</style></head><body><div class="nav"><div class="logo">🛡️ طمّن <span>AI</span></div><div class="badge">● النظام يعمل</div></div><div class="hero"><div><h1>لا تضغط<br><span class="g">قبل ما تطمّن.</span></h1><p class="sub">نفحص لك أي رابط مشبوه في ثواني بالذكاء الاصطناعي.</p><div class="glass"><div class="in"><input id="url" placeholder="https://example.com"><button id="btn" class="btn" onclick="check()">افحص الآن</button></div><div id="result" class="result"></div></div></div><div style="font-size:100px;text-align:center">🛡️</div></div><script>async function check(){const u=document.getElementById('url').value.trim();const b=document.getElementById('btn');const r=document.getElementById('result');if(!u){r.className='result warn show';r.innerHTML='الصق رابط أول';return}b.disabled=true;b.textContent='جاري الفحص...';r.style.display='none';try{const res=await fetch('/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});const d=await res.json();let c='safe';if(d.level==='عالي')c='danger';else if(d.level==='متوسط')c='warn';r.className='result show '+c;r.innerHTML=`<b>${d.level==='عالي'?'🔴 خطر عالي':d.level==='متوسط'?'🟡 انتبه':'🟢 آمن'} - ${d.level}</b><div style="margin-top:8px;line-height:1.8">${d.reason}</div><div style="margin-top:10px;font-size:12px;opacity:.7">${d.domain} - ${d.score}%</div>`}catch(e){r.className='result danger show';r.innerHTML='ما قدرنا نفحص'}b.disabled=false;b.textContent='افحص الآن'}</script></body></html>
