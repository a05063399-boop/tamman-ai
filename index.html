<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#f0f6ef;display:flex;justify-content:center;min-height:100vh}
.phone{width:400px;background:#f0f6ef;min-height:100vh;padding:16px 16px 100px;position:relative}
.card-main{background:white;border-radius:28px;padding:22px 18px;box-shadow:0 10px 30px #00000010;border:1px solid #00000006}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;color:#0a5d2e;font-size:42px;font-weight:800}
.logo svg{width:54px;height:54px}
.sub-green{color:#1a8a4a;text-align:center;font-size:17px;margin:4px 0 18px;font-weight:700}
.title{font-size:26px;font-weight:800;text-align:center;margin-bottom:6px}
.desc{font-size:13px;opacity:.6;text-align:center;margin-bottom:16px}
.input-box{background:#f8faf8;border:1.5px solid #c8e6c9;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.input-box input{flex:1;border:0;background:transparent;outline:none;font-size:14px;text-align:right;direction:ltr}
.btn-main{width:100%;background:#0ca24b;color:white;border:0;padding:16px;border-radius:14px;font-size:22px;font-weight:800;margin-top:14px;cursor:pointer;box-shadow:0 6px 18px #0ca24b40}
.tip{background:#f1f8e9;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.tip b{color:#2e5d23;font-size:15px}
.tip p{font-size:11px;opacity:.7;line-height:1.4}
.live-head{display:flex;justify-content:space-between;margin:18px 4px 10px;font-weight:800;font-size:15px}
.live-head a{color:#0ca24b;font-size:13px;text-decoration:none}
.live-item{background:white;border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;border:1px solid #00000008;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.icon-ok{width:32px;height:32px;background:#e8f5e9;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0ca24b;font-weight:800}
.icon-warn{width:32px;height:32px;background:#fff3e0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ff9800;font-weight:800}
.url{font-size:12px;direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700;margin-top:2px;display:inline-block}
.badge-ok{background:#e8f5e9;color:#1b8a4a}
.badge-bad{background:#fff3e0;color:#e67e00}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:4px}
.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:380px;background:white;border-radius:22px;display:flex;justify-content:space-around;padding:10px 0;box-shadow:0 10px 30px #00000015;border:1px solid #00000008}
.nav button{border:0;background:transparent;color:#9e9e9e;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.nav button.active{color:#0ca24b}
.result{margin-top:12px;padding:12px;border-radius:12px;font-size:13px}
.result.safe{background:#e8f5e9;border:1px solid #0ca24b;color:#0a5d2e}
.result.bad{background:#ffebee;border:1px solid #ff4444;color:#7a1a1a}
</style>
</head>
<body>
<div class="phone">
  <div class="card-main">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="#0ca24b"><path d="M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3zm-1 14l-4-4 1.4-1.4 2.6 2.6 5.6-5.6L18 9l-7 7z"/></svg>
      طمّن
    </div>
    <div class="sub-green">فحص الروابط المشبوهة</div>
    <div class="title">مرحباً</div>
    <div class="desc">أدخل الرابط أدناه لفحصه والتأكد من سلامته</div>

    <div class="input-box">
      <span>🔗</span>
      <input id="urlIn" placeholder="الصق الرابط هنا...">
    </div>
    <button class="btn-main" onclick="doScan()">افحص الآن</button>
    <div id="out"></div>

    <div class="tip">
      <div style="background:#e8f5e9;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center">🛡️</div>
      <div>
        <b>نصيحة أمنية</b>
        <p>تجنّب الروابط المختصرة المجهولة واحرص على التحقق قبل الفتح</p>
      </div>
    </div>
  </div>

  <div class="live-head"><span>آخر الفحوصات</span><a href="#" onclick="renderLive()">عرض الكل</a></div>
  <div id="liveList"><div style="text-align:center;opacity:.4;font-size:12px;padding:20px">جاري تحميل الفحوصات المباشرة...</div></div>
</div>

<div class="nav">
  <button class="active">🛡️<span>الرئيسية</span></button>
  <button onclick="renderLive()">🕒<span>الفحوصات</span></button>
  <button>📱<span>الحماية</span></button>
  <button>⚙️<span>الإعدادات</span></button>
</div>

<script>
const API = ""; // يشتغل على نفس رابط render

function maskUrl(u){
  try{
    let clean = u.replace('https://','').replace('http://','');
    if(clean.length < 12) return clean.slice(0,2)+"****"+clean.slice(-3);
    return clean.slice(0,12)+"****"+clean.slice(-4);
  }catch{return u.slice(0,5)+"****"}
}

async function renderLive(){
  try{
    let r = await fetch(API+'/api/live');
    let data = await r.json();
    if(!data.length){
      document.getElementById('liveList').innerHTML = '<div style="text-align:center;opacity:.4;font-size:12px;padding:20px">لا يوجد فحوصات حاليا</div>';
      return;
    }
    document.getElementById('liveList').innerHTML = data.map(h=>`
      <div class="live-item">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="${h.isBad?'icon-warn':'icon-ok'}">${h.isBad?'!':'✓'}</div>
          <div>
            <div class="url">${h.url}</div>
            <div style="font-size:11px;opacity:.6">تم الفحص قبل ثواني • <span class="${h.isBad?'badge-bad':'badge-ok'} badge">${h.isBad?'مشبوه':'آمن'}</span></div>
          </div>
        </div>
        <div class="dot" style="background:${h.isBad?'#ff9800':'#0ca24b'}"></div>
      </div>
    `).join('');
  }catch(e){
    // لو الباك اند مو شغال، طلع من localStorage
    let hist = JSON.parse(localStorage.getItem('tammen_live')||'[]');
    document.getElementById('liveList').innerHTML = hist.slice(0,5).map(h=>`
      <div class="live-item">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="${h.isBad?'icon-warn':'icon-ok'}">${h.isBad?'!':'✓'}</div>
          <div><div class="url">${h.url}</div><div class="badge ${h.isBad?'badge-bad':'badge-ok'}">${h.isBad?'مشبوه':'آمن'}</div></div>
        </div>
      </div>
    `).join('') || '<div style="text-align:center;opacity:.4;font-size:12px;padding:20px">لا يوجد فحوصات</div>';
  }
}
setInterval(renderLive, 5000); // تحديث كل 5 ثواني لايف
renderLive();

async function doScan(){
  let v = document.getElementById('urlIn').value.trim();
  if(!v) return alert('الصق رابط اول');
  let out = document.getElementById('out');
  out.innerHTML = '<div class="result safe">⏳ جاري الفحص عبر طَمّن AI...</div>';
  try{
    let r = await fetch(API+'/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:v})});
    let data = await r.json();
    out.innerHTML = `<div class="result ${data.is_phishing?'bad':'safe'}">${data.is_phishing?'⚠️ رابط مشبوه! لا تفتحه':'✅ رابط آمن'}<br><small>${data.url}</small></div>`;
  }catch{
    let bad = v.includes('short')||v.includes('xyz');
    out.innerHTML = `<div class="result ${bad?'bad':'safe'}">${bad?'⚠️ مشبوه':'✅ آمن - فحص محلي'}<br><small>${v}</small></div>`;
    // حفظ محلي
    let hist = JSON.parse(localStorage.getItem('tammen_live')||'[]');
    hist.unshift({url:maskUrl(v),isBad:bad,time:Date.now()});
    localStorage.setItem('tammen_live',JSON.stringify(hist.slice(0,5)));
  }
  renderLive();
}
</script>
</body>
</html>
