<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طمّن - CyberGuard 365</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#0a1628;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.phone{width:380px;background:linear-gradient(180deg,#0e4a6b 0%,#0a2f4a 40%,#0a1e35 100%);border-radius:35px;padding:18px 18px 25px;box-shadow:0 20px 60px rgba(0,0,0,0.5);position:relative;overflow:hidden}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.en-btn{background:#b6f5a0;color:#0a2f2a;padding:6px 16px;border-radius:20px;font-weight:800;font-size:14px}
.main-card{background:linear-gradient(135deg,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0.04) 100%);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:22px 18px 18px}
.circle-wrap{position:relative;width:170px;height:170px;margin:0 auto 18px}
.circle-bg{width:100%;height:100%;border-radius:50%;border:8px solid rgba(255,255,255,0.12)}
.circle-progress{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;border:8px solid transparent;border-top-color:#5ee9b5;border-right-color:#5ee9b5;transform:rotate(-45deg)}
.circle-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff}
.circle-center .num{font-size:32px;font-weight:800}
.circle-center .label{font-size:11px;opacity:0.7;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:12px 8px;text-align:center;color:#fff}
.stat.active{background:rgba(94,233,181,0.15);border-color:#5ee9b5}
.stat .t{font-size:12px;opacity:0.8} .stat .n{font-size:18px;font-weight:800;margin-top:2px}
.details{background:rgba(255,255,255,0.06);border-radius:18px;padding:14px}
.details h4{color:#fff;font-size:13px;margin-bottom:12px}
.item{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.06);border-radius:12px;padding:10px 12px;margin-bottom:8px;color:#fff;font-size:12px}
.badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.badge.crit{background:#ff4d5a20;color:#ff6b7a;border:1px solid #ff6b7a50}
.badge.high{background:#ff950020;color:#ffb020;border:1px solid #ffb02050}
.badge.med{background:#ffe60020;color:#ffe600;border:1px solid #ffe60050}
input.link-input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:12px;color:#fff;margin:10px 0;font-size:13px;direction:ltr}
.check-btn{background:linear-gradient(90deg,#5ee9b5,#3ec9a7);color:#0a2f2a;padding:8px 18px;border-radius:20px;font-weight:800;font-size:12px;border:none;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
<div class="top-bar"><span style="color:#fff;font-size:13px">CyberGuard AI نشطة 🛡️</span><span class="en-btn">EN</span></div>
<div class="main-card">
<div class="circle-wrap">
<div class="circle-bg"></div>
<div class="circle-progress"></div>
<div class="circle-center"><div class="num">day/365</div><div class="label">اجمالي الروابط المحمية</div></div>
</div>
<div class="stats">
<div class="stat"><div class="t">متوسط</div><div class="n">150</div></div>
<div class="stat active"><div class="t">عالي</div><div class="n">95</div></div>
<div class="stat"><div class="t">حرج</div><div class="n" style="color:#ff6b7a">89</div></div>
</div>
<div class="details">
<h4>تفاصيل الروابط</h4>
<div class="item"><span>🔴 روابط بنوك وهمية</span><span class="badge crit">CRITICAL 89</span></div>
<div class="item"><span>🟠 عروض وهمية</span><span class="badge high">HIGH 95</span></div>
<div class="item"><span>🟡 روابط مشبوهة</span><span class="badge med">MEDIUM 150</span></div>
</div>
<input class="link-input" id="linkInput" placeholder="الصق الرابط هنا... https://">
<button class="check-btn" style="width:100%;margin-top:8px;padding:12px" onclick="checkLink()">🔗 افحص الآن</button>
<div id="result" style="margin-top:12px;color:#fff;font-size:13px;text-align:center"></div>
</div>
</div>
</div>
<script>
function checkLink(){
 const v=document.getElementById('linkInput').value;
 const r=document.getElementById('result');
 if(!v){r.innerHTML='الصقي رابط اولاً';return}
 let score=0;
 if(v.includes('tk')||v.includes('secure-')||v.includes('login')) score=95;
 else if(v.includes('http://')) score=85;
 else score=10;
 if(score>80) r.innerHTML='🔴 <b style="color:#ff6b7a">خطر عالي - رابط وهمي!</b>';
 else if(score>50) r.innerHTML='🟡 <b style="color:#ffb020">متوسط - انتبهي</b>';
 else r.innerHTML='🟢 <b style="color:#5ee9b5">سليم</b>';
}
</script>
</body>
</html>
