<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;500&display=swap" rel="stylesheet">
<script>
let L = localStorage.getItem('lang')||'ar';

const T = {
 ar: {
   hello: "مرحبا بعودتك",
   scanTitle: "فحص الروابط المشبوهة",
   welcome: "مرحباً",
   desc: "أدخل الرابط أدناه لفحصه والتأكد من سلامته",
   placeholderLink: "الصق الرابط هنا...",
   btn: "افحص الآن",
   tipTitle: "نصيحة أمنية",
   tipText: "تجنّب الروابط المختصرة المجهولة",
   live1: "آخر الفحوصات",
   live2: "آخر فحوصات الأرقام",
   nav1: "الروابط",
   nav2: "الجوال",
   nav3: "الإعدادات",
   phonePlace: "+966 5X XXX XXXX",
   phoneTitle: "فحص الأرقام"
 },
 en: {
   hello: "Welcome back",
   scanTitle: "Suspicious Link Scanner",
   welcome: "Hello",
   desc: "Enter the link below to check its safety",
   placeholderLink: "Paste link here...",
   btn: "Scan Now",
   tipTitle: "Security Tip",
   tipText: "Avoid unknown short links",
   live1: "Recent Scans",
   live2: "Recent Phone Scans",
   nav1: "Links",
   nav2: "Mobile",
   nav3: "Settings",
   phonePlace: "+966 5X XXX XXXX",
   phoneTitle: "Phone Number Check"
 }
}

function applyLang(){
  document.documentElement.dir = L=='ar'?'rtl':'ltr';
  document.documentElement.lang = L;
  document.getElementById('langBtn').innerText = L=='ar'?'EN':'AR';
  document.getElementById('t0').innerText = T[L].hello;
  document.querySelector('#p1.sub-green').innerText = T[L].scanTitle;
  document.querySelector('#p1.title').innerText = T[L].welcome;
  document.querySelector('#p1.desc').innerText = T[L].desc;
  document.getElementById('urlIn').placeholder = T[L].placeholderLink;
  document.querySelector('#p1.btn-main').innerText = T[L].btn;
  document.getElementById('liveT1').innerText = T[L].live1;
  document.querySelectorAll('.nav span')[0].innerText = T[L].nav1;
  document.querySelectorAll('.nav span')[1].innerText = T[L].nav2;
  document.querySelectorAll('.nav span')[2].innerText = T[L].nav3;
  if(document.getElementById('phoneIn')){
    document.getElementById('phoneIn').placeholder = T[L].phonePlace;
    document.querySelector('#p2.sub-green').innerText = T[L].phoneTitle;
    document.querySelector('#p2.btn-main').innerText = T[L].btn;
  }
  // نصيحة
  let tipB = document.querySelector('.tip b');
  if(tipB) tipB.innerText = T[L].tipTitle;
}

function toggleLang(){
  L = L=='ar'?'en':'ar';
  localStorage.setItem('lang',L);
  applyLang();
}

function go(n){
 document.getElementById('p1').classList.toggle('active',n==1);
 document.getElementById('p2').classList.toggle('active',n==2);
 document.getElementById('p3').classList.toggle('active',n==3);
 document.getElementById('b1').classList.toggle('active',n==1);
 document.getElementById('b2').classList.toggle('active',n==2);
 document.getElementById('b3').classList.toggle('active',n==3);
}
function maskUrl(u){try{let c=u.replace('https://','').replace('http://','');return c.slice(0,4)+'****'+c.slice(-4)}catch{return u.slice(0,3)+'****'}}

async function renderLive(){
 try{
  let r=await fetch('/api/live'); let data=await r.json();
  document.getElementById('liveList').innerHTML=data.map(h=>`<div class="live-item"><div style="display:flex;gap:10px;align-items:center"><div style="width:32px;height:32px;border-radius:50%;background:${h.isBad?'#fff3e0':'#e8f5e9'};display:flex;align-items:center;justify-content:center">${h.isBad?'!':'✓'}</div><div><div class="url">${h.url}</div><span class="badge ${h.isBad?'badge-bad':'badge-ok'}">${h.isBad?'مشبوه':'آمن'}</span></div></div><div style="width:8px;height:8px;border-radius:50%;background:${h.isBad?'#ff9800':'#0ca24b'}"></div></div>`).join('')||'<div style="text-align:center;opacity:.4;padding:20px;font-size:12px">لا يوجد فحوصات</div>';
 }catch{
  let hist=JSON.parse(localStorage.getItem('tammen_live')||'[]');
  document.getElementById('liveList').innerHTML=hist.map(h=>`<div class="live-item"><div class="url">${h.url}</div><span class="badge ${h.isBad?'badge-bad':'badge-ok'}">${h.isBad?'مشبوه':'آمن'}</span></div>`).join('');
 }
}
setInterval(renderLive,5000); renderLive(); applyLang();

async function doScanLink(){
 let v=document.getElementById('urlIn').value.trim(); if(!v) return;
 document.getElementById('outLink').innerHTML='<div class="result safe">⏳ جاري الفحص...</div>';
 try{
  let r=await fetch('/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:v})});
  let data=await r.json();
  document.getElementById('outLink').innerHTML=`<div class="result ${data.is_phishing?'bad':'safe'}">${data.is_phishing?'⚠️ مشبوه':'✅ آمن'}<br><small>${data.ai_analysis||data.url}</small></div>`;
 }catch{
  let bad=v.includes('short')||v.includes('xyz');
  document.getElementById('outLink').innerHTML=`<div class="result ${bad?'bad':'safe'}">${bad?'⚠️ مشبوه':'✅ آمن'}</div>`;
 }
 renderLive();
}
function doScanPhone(){
 let v=document.getElementById('phoneIn').value.trim(); if(!v) return;
 let bad=v.includes('000');
 document.getElementById('outPhone').innerHTML=bad?`<div class="result bad">⚠️ رقم احتيال</div>`:`<div class="result safe">✅ رقم آمن</div>`;
}
</script>
</head>
<body>
<div class="phone">
  <div class="top">
    <div style="display:flex;align-items:center;gap:8px"><div style="width:36px;height:36px;border-radius:50%;background:url(https://i.pravatar.cc/100) center/cover"></div><div><small id="t0" style="opacity:.6;font-size:10px">مرحبا بعودتك</small><br><b>طَمّن</b></div></div>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>
  </div>

  <div id="p1" class="page active">
    <div class="card-main">
      <div class="logo"><svg viewBox="0 0 24 24" fill="#0ca24b"><path d="M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3zm-1 14l-4-4 1.4-1.4 2.6 2.6 5.6-5.6L18 9l-7 7z"/></svg>طَمّن</div>
      <div class="sub-green">فحص الروابط المشبوهة</div>
      <div class="title">مرحباً</div>
      <div class="desc">أدخل الرابط أدناه لفحصه والتأكد من سلامته</div>
      <div class="input-box"><span>🔗</span><input id="urlIn" placeholder="الصق الرابط هنا..."></div>
      <button class="btn-main" onclick="doScanLink()">افحص الآن</button>
      <div id="outLink"></div>
      <div class="tip"><div>🛡️</div><div><b>نصيحة أمنية</b><br><small style="opacity:.7;font-size:11px">تجنّب الروابط المختصرة المجهولة</small></div></div>
    </div>

    <!-- هذا السطر اللي طلبته -->
    <div class="live-head"><span id="liveT1">آخر الفحوصات</span><span style="color:#0ca24b;font-size:13px;font-weight:800;display:flex;align-items:center;gap:4px">🔴 لايف</span></div>
    <div id="liveList"></div>
  </div>

  <div id="p2" class="page">
    <div class="card-main">
      <div class="logo" style="color:#6b46c1"><svg viewBox="0 0 24 24" fill="#6b46c1"><path d="M17 2H7c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H7V4h10v16z"/></svg>طَمّن</div>
      <div class="sub-green" style="color:#6b46c1">فحص الأرقام</div>
      <div class="input-box" style="border-color:#d6bcfa"><span>📱</span><input id="phoneIn" placeholder="+966 5X XXX XXXX"></div>
      <button class="btn-main" style="background:#6b46c1" onclick="doScanPhone()">افحص الآن</button>
      <div id="outPhone"></div>
    </div>
    <div class="live-head"><span>آخر فحوصات الأرقام</span><span style="color:#6b46c1;font-size:13px;font-weight:800;display:flex;align-items:center;gap:4px">🔴 لايف</span></div>
    <div id="liveList2"></div>
  </div>

  <div id="p3" class="page">
    <div class="card-main"><b>الإعدادات</b><br><br><div style="font-size:13px;opacity:.7">حماية طمّن نشطة 🟢<br>الإصدار العالمي 1.0<br>tamman-ai.onrender.com</div></div>
  </div>
</div>

<div class="nav">
  <button id="b1" class="active" onclick="go(1)">🔗<span>الروابط</span></button>
  <button id="b2" onclick="go(2)">📱<span>الجوال</span></button>
  <button id="b3" onclick="go(3)">⚙️<span>الإعدادات</span></button>
</div>

<script>
let L = localStorage.getItem('lang')||'ar';
function toggleLang(){L=L=='ar'?'en':'ar';localStorage.setItem('lang',L);location.reload()}

 document.getElementById('p1').classList.toggle('active',n==1);

 document.getElementById('b1').classList.toggle('active',n==1);
 document.getElementById('b2').classList.toggle('active',n==2);
 document.getElementById('b3').classList.toggle('active',n==3);
}

  document.getElementById('liveList').innerHTML=hist.map(h=>`<div class="live-item"><div class="url">${h.url}</div><span class="badge ${h.isBad?'badge-bad':'badge-ok'}">${h.isBad?'مشبوه':'آمن'}</span></div>`).join('');
 }
}
setInterval(renderLive,5000); renderLive();

 let v=document.getElementById('urlIn').value.trim(); if(!v) return;
 document.getElementById('outLink').innerHTML='<div class="result safe">⏳ جاري الفحص...</div>';
 try{
  let r=await fetch('/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:v})});
  let data=await r.json();
  document.getElementById('outLink').innerHTML=`<div class="result ${data.is_phishing?'bad':'safe'}">${data.is_phishing?'⚠️ مشبوه':'✅ آمن'}<br><small>${data.url}</small></div>`;
 }catch{
  let bad=v.includes('short')||v.includes('xyz');
  document.getElementById('outLink').innerHTML=`<div class="result ${bad?'bad':'safe'}">${bad?'⚠️ مشبوه':'✅ آمن'}</div>`;

 document.getElementById('outPhone').innerHTML=bad?`<div class="result bad">⚠️ رقم احتيال</div>`:`<div class="result safe">✅ رقم آمن</div>`;
}
</script>
</body>
</html>
